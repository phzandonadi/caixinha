<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Perfil da loja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none}
button,input{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="Menu.dc.html" aria-label="Voltar ao menu" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Perfil da loja</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 24px 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #FFE9D2">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
<span style="font-size: 14px; font-weight: 700; line-height: 1.35; color: #4A1F05">Só administradores podem editar a loja e as unidades.</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="position: relative; width: 112px; height: 112px">
<div style="width: 112px; height: 112px; box-sizing: border-box; border-radius: 30px; background: #FFE3C8; border: 3px solid #FA9445; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"></path><path d="M5 12v8h14v-8M10 20v-4h4v4"></path></svg>
</div>
<button type="button" aria-label="Trocar imagem da loja" style="position: absolute; right: -6px; bottom: -4px; width: 40px; height: 40px; border-radius: 20px; border: 3px solid #FFF6EC; background: {{accent}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome da loja</label>
<input id="nome" type="text" value="Moda Express" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cnpj" style="font-size: 14px; font-weight: 700; color: #4A1F05">CNPJ</label>
<input id="cnpj" type="text" inputmode="numeric" value="00.000.000/0001-00" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="endereco" style="font-size: 14px; font-weight: 700; color: #4A1F05">Endereço da sede</label>
<input id="endereco" type="text" value="Rua das Flores, 123 – Centro, São Paulo/SP" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<button type="button" style="height: 52px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 2px">Salvar alterações</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; color: #4A1F05">Unidades</h2>
<span style="font-size: 14px; font-weight: 700; color: #5C3A24">{{countLabel}}</span>
</div>

<a href="NovaLoja.dc.html" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 14px; border: 2px dashed #C98A5B; border-radius: 18px; background: #FFFFFF">
<span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</span>
<span style="flex: 1; font-size: 16px; font-weight: 800; color: {{accent}}">Adicionar unidade</span>
</a>

<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px">
<div style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #FFE3C8; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#9C430C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"></path><path d="M5 12v8h14v-8M10 20v-4h4v4"></path></svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; line-height: 1.25; color: #2E1203">{{u.name}}</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.35; color: #5C3A24">{{u.address}}</span>
<span style="font-size: 13px; font-weight: 800; color: {{accent}}">{{u.items}}</span>
</div>
<a href="EditarLoja.dc.html" aria-label="Editar {{u.name}}" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #F3DFCB; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4A1F05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
</a>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const units = [
{ name: 'Loja Centro', address: 'Rua das Flores, 123 – Centro', items: '4 itens' },
{ name: 'Loja Shopping', address: 'Av. Brasil, 1500 – Shopping Plaza, piso 2', items: '3 itens' },
{ name: 'Loja Norte', address: 'Rua Norte, 45 – Zona Norte', items: '3 itens' }
];
return {
accent: this.props.accent ?? '#9C430C',
units: units,
countLabel: units.length + ' unidades'
};
}
}
</script>
</body>
</html>
