<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixinha - Boas-vindas</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
html,body{margin:0;height:100%}
x-dc{display:block;height:100%}
a{text-decoration:none}
button,input,select{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">
<div style="flex: none; padding: 40px 24px 0 24px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 800; color: {{accent}}; text-transform: uppercase; letter-spacing: 0.06em">Passo {{step}} de 3</span><h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.15; color: #2E1203">{{title}}</h1><p style="margin: 0; font-size: 16px; font-weight: 600; color: #5C3A24">{{help}}</p></div><div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px"><sc-if value="{{ s1 }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 6px"><label for="loja" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome da loja</label><input id="loja" type="text" value="{{shop}}" onChange="{{on_shop}}" placeholder="Ex.: Moda Express" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div></sc-if><sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px"><label for="u1" style="font-size: 14px; font-weight: 700; color: #4A1F05">Primeira unidade</label><input id="u1" type="text" value="{{u1}}" onChange="{{on_u1}}" placeholder="Ex.: Loja Centro" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="u2" style="font-size: 14px; font-weight: 700; color: #4A1F05">Segunda unidade (opcional)</label><input id="u2" type="text" value="{{u2}}" onChange="{{on_u2}}" placeholder="Ex.: Loja Shopping" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div></sc-if><sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}"><a href="NovoItem.dc.html" style="height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">Adicionar primeiro produto</a><a href="Importar.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{accent}}; color: {{accent}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Importar planilha</a></sc-if><sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FAD2CB; color: #7A1E10; font-size: 14px; font-weight: 700">{{err}}</p></sc-if></div><sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}"><div style="flex: none; padding: 12px 24px 28px 24px"><button type="button" onClick="{{next}}" style="height: 56px; width: 100%; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">Continuar</button></div></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';

const st = this.state || {};
const step = st.step || 1;
const shop = st.shop === undefined ? '' : st.shop;
const u1 = st.u1 === undefined ? '' : st.u1, u2 = st.u2 === undefined ? '' : st.u2;
const T = { 1: ['Como se chama a sua loja?', 'Esse nome aparece no topo do app.'], 2: ['Onde você guarda estoque?', 'Cadastre as unidades. Você pode mudar isso depois.'], 3: ['Tudo pronto. Agora o primeiro produto.', 'Cadastre um item ou importe uma planilha que você já tem.'] };
return {
accent: accent, step: String(step), title: T[step][0], help: T[step][1],
s1: step === 1, s2: step === 2, s3: step === 3, notLast: step < 3,
shop: shop, u1: u1, u2: u2,
on_shop: (e) => this.setState({ shop: e.target.value, err: '' }),
on_u1: (e) => this.setState({ u1: e.target.value, err: '' }),
on_u2: (e) => this.setState({ u2: e.target.value, err: '' }),
hasErr: !!st.err, err: st.err || '',
next: () => {
if (step === 1) { if (!shop.trim()) { this.setState({ err: 'Digite o nome da sua loja para continuar.' }); return; } this.setState({ step: 2, err: '' }); return; }
if (step === 2) {
if (!u1.trim()) { this.setState({ err: 'Digite o nome da primeira unidade.' }); return; }
const s = CX.get(); s.vazio = true; s.shopName = shop.trim(); s.items = []; s.mov = []; s.toast = null; s.users = [{ id: 1, nome: s.userName || 'Você', email: '', cargo: 'Administrador', lojas: 'Todas as lojas', status: 'Ativo' }];
CX.save();
this.setState({ step: 3, err: '' });
}
}
};

}
}
</script>
</body>
</html>
