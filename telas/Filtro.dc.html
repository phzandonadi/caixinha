<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Filtrar itens</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF6EC}
button{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="display: flex; flex-direction: column; flex: 1; min-height: 0">
<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 8px">
<div style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 2px solid #FA9445; background: #FFF1E2; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9C430C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"></circle><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"></path></svg>
</div>
<div style="flex: 1; min-width: 0; height: 48px; border-radius: 16px; background: #7E3409; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 700; color: #FFD9B0; line-height: 1.1">Estoque</span>
<span style="font-size: 16px; font-weight: 800; color: #FFF1E2; line-height: 1.2">Todas as lojas</span>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</div>
<div style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #FFF1E2; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#9C430C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>
</div>
<div style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
</div>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 8px 20px">
<span style="font-size: 20px; font-weight: 800; color: #4A1F05">Itens do estoque</span>
<span style="font-size: 14px; font-weight: 700; color: #5C3A24">10 itens</span>
</div>
<div style="padding: 4px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px">
<div style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #FFE3C8"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; color: #2E1203">Camiseta básica branca M</span>
<span style="font-size: 13px; font-weight: 600; color: #5C3A24">Roupas · Loja Centro</span>
</div>
<span style="font-size: 26px; font-weight: 800; color: #4A1F05">48</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px">
<div style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #FFE3C8"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; color: #2E1203">Calça jeans slim 42</span>
<span style="font-size: 13px; font-weight: 600; color: #5C3A24">Roupas · Loja Shopping</span>
</div>
<span style="font-size: 26px; font-weight: 800; color: #4A1F05">6</span>
</div>
</div>
</div>

<div style="position: absolute; z-index: 1; left: 0; top: 0; right: 0; bottom: 0; background: rgba(46, 18, 3, 0.55)"></div>

<div role="dialog" aria-label="Filtrar itens" style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; box-sizing: border-box; background: #FFF6EC; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 20px; display: flex; flex-direction: column; box-shadow: 0 -8px 32px rgba(46, 18, 3, 0.3)">

<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #D9BFA6; margin-bottom: 14px"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div>
<h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #4A1F05">Filtrar</h2>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5C3A24">{{activeLabel}}</p>
</div>
<a href="Home.dc.html" aria-label="Fechar filtros" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #F3DFCB; text-decoration: none; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4A1F05" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<h3 style="margin: 20px 0 10px 0; font-size: 15px; font-weight: 800; color: #4A1F05">Situação do estoque</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{statusChips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">
<span style="width: 10px; height: 10px; flex: none; border-radius: 5px; background: {{c.dot}}"></span>
<span>{{c.label}}</span>
<span style="font-size: 13px; font-weight: 700">{{c.count}}</span>
<sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<h3 style="margin: 20px 0 10px 0; font-size: 15px; font-weight: 800; color: #4A1F05">Categoria</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{catChips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">
<span>{{c.label}}</span>
<span style="font-size: 13px; font-weight: 700">{{c.count}}</span>
<sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 28px">
<button type="button" onClick="{{clearAll}}" style="flex: none; height: 52px; padding: 0 20px; border: 2px solid {{accent}}; border-radius: 16px; background: transparent; color: {{accent}}; font-size: 16px; font-weight: 800; cursor: pointer">Limpar</button>
<a href="Home.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center">{{showLabel}}</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const st = this.state || {};
const fl = CX.filter();
const statusSel = st.status || fl.status;
const catSel = st.cat || fl.cat;
const all = CX.get().items.map((i) => ({ cat: i.cat, key: CX.status(i) === 'ok' ? 'em' : (CX.status(i) === 'baixo' ? 'baixo' : 'sem') }));
const statusOf = (k) => k;
const statuses = [
{ key: 'em', label: 'Em estoque', dot: '#5FBF4A' },
{ key: 'baixo', label: 'Estoque baixo', dot: '#F2B705' },
{ key: 'sem', label: 'Sem estoque', dot: '#F0604D' }
];
const cats = ['Roupas', 'Calçados', 'Acessórios'];
const style = (on) => ({
bg: on ? accent : '#FFFFFF',
fg: on ? '#FFFFFF' : '#2E1203',
border: on ? accent : '#D9BFA6'
});
const statusChips = statuses.map((s) => {
const on = statusSel.includes(s.key);
return Object.assign({
label: s.label, dot: s.dot, on: on,
count: String(all.filter((i) => statusOf(i.key) === s.key).length),
toggle: () => {
const cur = this.state && this.state.status ? this.state.status : CX.filter().status;
const nx = cur.includes(s.key) ? cur.filter((x) => x !== s.key) : cur.concat(s.key);
CX.setFilter({ status: nx, cat: (this.state && this.state.cat) || CX.filter().cat });
this.setState({ status: nx });
}
}, style(on));
});
const catChips = cats.map((c) => {
const on = catSel.includes(c);
return Object.assign({
label: c, dot: 'transparent', on: on,
count: String(all.filter((i) => i.cat === c).length),
toggle: () => {
const cur = this.state && this.state.cat ? this.state.cat : CX.filter().cat;
const nx = cur.includes(c) ? cur.filter((x) => x !== c) : cur.concat(c);
CX.setFilter({ status: (this.state && this.state.status) || CX.filter().status, cat: nx });
this.setState({ cat: nx });
}
}, style(on));
});
const n = all.filter((i) => (statusSel.length === 0 || statusSel.includes(i.key)) && (catSel.length === 0 || catSel.includes(i.cat))).length;
const active = statusSel.length + catSel.length;
return {
accent: accent,
statusChips: statusChips,
catChips: catChips,
activeLabel: active === 0 ? 'Nenhum filtro ativo' : (active === 1 ? '1 filtro ativo' : active + ' filtros ativos'),
showLabel: n === 0 ? 'Nenhum item encontrado' : 'Mostrar ' + n + (n === 1 ? ' item' : ' itens'),
clearAll: () => { CX.setFilter({ status: [], cat: [] }); this.setState({ status: [], cat: [] }); }
};
}
}
</script>
</body>
</html>
