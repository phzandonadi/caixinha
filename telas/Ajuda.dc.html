<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Ajuda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
body{margin:0;background:#FFF6EC}
a{text-decoration:none}
button{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="Mais.dc.html" aria-label="Voltar ao menu" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Ajuda</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 28px 16px; display: flex; flex-direction: column; gap: 16px">

<p style="margin: 0 4px; font-size: 16px; font-weight: 700; line-height: 1.4; color: #4A1F05">Como podemos ajudar?</p>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px; overflow: hidden">
<button type="button" onClick="{{f.flip}}" aria-expanded="{{f.open}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 10px 14px; border: 0; background: transparent; cursor: pointer; text-align: left">
<span style="flex: 1; font-size: 16px; font-weight: 800; line-height: 1.3; color: #2E1203">{{f.q}}</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; transform: rotate({{f.rot}}deg)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 14px 14px 14px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #5C3A24">{{f.a}}</p>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #FFE9D2">
<span style="font-size: 17px; font-weight: 800; color: #4A1F05">Não achou o que precisava?</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #5C3A24">Fale com a nossa equipe de suporte.</span>
<button type="button" style="height: 52px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.2-4.6A8 8 0 1 1 21 12z"></path></svg>
Falar com o suporte
</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const openId = this.state && this.state.open !== undefined ? this.state.open : 0;
const defs = [
{ q: 'Como adiciono um item ao estoque?', a: 'Na tela inicial, toque no botão + e escolha “Adicionar item”. Preencha a foto, o nome, o código do produto, a categoria, o preço de venda, o custo, a quantidade em cada loja e os outros nomes do produto, e salve.' },
{ q: 'Como registro uma entrada ou saída?', a: 'Toque no item para abrir a ficha e escolha “Entrada” ou “Saída”. Digite a quantidade, escolha a loja e o motivo, e confirme. Se errar, toque em “Desfazer” no aviso que aparece.' },
{ q: 'Como cadastro tamanhos e cores (variações)?', a: 'Cadastre o produto uma vez, como Camiseta básica branca, e em “Este produto tem variações?” toque em Sim. Adicione P, M, G e GG: cada variação tem o próprio SKU e o próprio estoque. Na planilha de importação, use uma linha por variação.' },
{ q: 'Como importo uma planilha?', a: 'Toque no botão + e escolha “Importar planilha”. Envie um arquivo XLSX do Excel com os seus itens, e o Caixinha cria os cadastros de uma vez.' },
{ q: 'Como vejo o estoque de só uma loja?', a: 'Toque no nome da loja no topo da tela inicial. Marque uma ou mais lojas, ou escolha “Todas as lojas”, e confirme.' },
{ q: 'Para que servem os outros nomes do produto?', a: 'São palavras parecidas com o nome do item, como “blusa” para uma camiseta. Eles ajudam a achar o item na busca, mesmo sem acento, e por voz.' },
{ q: 'Como adiciono outra pessoa à loja?', a: 'Só administradores podem fazer isso. Abra o menu, vá em Usuários, toque em “Adicionar usuário” e envie o convite por e-mail.' }
];
return {
accent: accent,
faqs: defs.map((d, i) => {
const open = openId === i;
return {
q: d.q, a: d.a, open: open, rot: open ? 180 : 0,
flip: () => this.setState({ open: open ? -1 : i })
};
})
};
}
}
</script>
</body>
</html>
