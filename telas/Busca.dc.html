<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Buscar itens</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
body{margin:0;background:#FFF6EC}
button{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 8px">
<a href="Home.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; text-decoration: none; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border-radius: 24px; background: #FFF6EC; padding: 0 4px 0 14px; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
<label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar item por nome, apelido ou código</label>
<input id="busca" type="text" value="{{query}}" onChange="{{onSearch}}" placeholder="Nome, apelido ou código" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; outline: none; font-family: 'Nunito', sans-serif; font-size: 16px; color: #2E1203">
<button type="button" onClick="{{scan}}" aria-label="Ler código de barras" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 9v6M11 9v6M15 9v6M18 9v6" stroke-width="1.6"></path></svg></button>
<button type="button" onClick="{{toggleMic}}" aria-pressed="{{listening}}" aria-label="Buscar por voz" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; background: {{micBg}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{micStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg>
</button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 24px 16px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{ hasPick }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FFE9D2; color: #4A1F05; font-size: 15px; font-weight: 800">{{pickText}}</p></sc-if>

<sc-if value="{{ listening }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 12px 0 12px">
<div style="position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; left: 0; top: 0; width: 220px; height: 220px; border-radius: 110px; background: #FFE9D2"></div>
<div style="position: absolute; left: 35px; top: 35px; width: 150px; height: 150px; border-radius: 75px; background: #FFD0A3"></div>
<div style="position: relative; width: 96px; height: 96px; border-radius: 48px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg>
</div>
</div>
<h2 style="margin: 20px 0 0 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1; color: #4A1F05">Ouvindo…</h2>
<p style="margin: 10px 0 0 0; font-size: 18px; font-weight: 700; line-height: 1.35; color: #5C3A24">“Mostre as roupas com estoque baixo”</p>
<button type="button" onClick="{{stopMic}}" style="margin-top: 28px; height: 52px; padding: 0 32px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px">
<svg viewBox="0 0 24 24" width="16" height="16" fill="#FFFFFF" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
Parar
</button>
</div>
</sc-if>

<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 0 4px; font-size: 15px; font-weight: 800; color: #4A1F05">Buscas recentes</h2>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 50px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; text-align: left">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7A5C48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="flex: 1; font-size: 16px; font-weight: 700; color: #2E1203">{{r.text}}</span>
</button>
</sc-for>
</div>

<h2 style="margin: 16px 4px 0 4px; font-size: 15px; font-weight: 800; color: #4A1F05">Experimente dizer</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{try1}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 16px; cursor: pointer; text-align: left"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg><span style="font-size: 15px; font-weight: 700; color: #2E1203">“Mostre as roupas com estoque baixo”</span></button>
<button type="button" onClick="{{try2}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 16px; cursor: pointer; text-align: left"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg><span style="font-size: 15px; font-weight: 700; color: #2E1203">“Quais itens estão sem estoque?”</span></button>
<button type="button" onClick="{{try3}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 16px; cursor: pointer; text-align: left"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg><span style="font-size: 15px; font-weight: 700; color: #2E1203">“Procurar tênis na Loja Centro”</span></button>
</div>
</sc-if>

<sc-if value="{{ voice }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FFE9D2; border-radius: 16px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 700; color: #4A1F05">Você pediu: “{{voiceText}}”</span>
</div>
</sc-if>

<sc-if value="{{ showList }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800; color: #4A1F05">Resultados</h2>
<span style="font-size: 14px; font-weight: 700; color: #5C3A24">{{countLabel}}</span>
</div>
<sc-for list="{{items}}" as="item" hint-placeholder-count="2">
<a href="{{item.href}}" aria-label="Abrir {{item.name}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px; text-decoration: none; color: inherit">
<div style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #FFE3C8; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#9C430C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"></path><path d="M4 8l8 4 8-4"></path><path d="M12 12v9"></path></svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; line-height: 1.25; color: #2E1203">{{item.name}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5C3A24">{{item.meta}}</span>
<span style="align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; background: {{item.chipBg}}; color: {{item.chipFg}}">{{item.chip}}</span>
</div>
<div style="flex: none; display: flex; flex-direction: column; align-items: center; min-width: 44px">
<span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.1; color: #4A1F05">{{item.qty}}</span>
<span style="font-size: 12px; font-weight: 700; color: #5C3A24">{{item.unid}}</span>
</div>
</a>
</sc-for>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 0"><p style="margin: 0; text-align: center; font-size: 15px; font-weight: 600; color: #5C3A24">Nenhum item encontrado para “{{query}}”.</p><sc-if value="{{ hasSuggestion }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{useSuggestion}}" style="height: 52px; border: 2px solid {{accent}}; border-radius: 16px; background: #FFFFFF; color: {{accent}}; font-size: 16px; font-weight: 800; cursor: pointer">Você quis dizer {{suggestion}}?</button></sc-if><a href="NovoItem.dc.html" style="height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Cadastrar novo item</a></div>
</sc-if>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const st = this.state || {};
const query = st.query || '';
const listening = !!st.listening;
const hasQuery = query.trim().length > 0;
const mode = (/^(entrada|saida)$/.exec(CX.hash()) || [])[1] || '';
const stores = CX.stores();
let found = [];
const vmode = st.voice;
const vtext = { baixo: 'Mostre as roupas com estoque baixo', zero: 'Quais itens estão sem estoque?', tenis: 'Procurar tênis na Loja Centro' };
if (vmode === 'baixo') found = CX.get().items.filter((i) => i.cat === 'Roupas' && CX.status(i) === 'baixo');
else if (vmode === 'zero') found = CX.get().items.filter((i) => CX.status(i) === 'zero');
else if (vmode === 'tenis') found = CX.search('tenis').filter((i) => (i.q.centro || 0) > 0);
else if (hasQuery && !listening) found = CX.search(query);
const items = found.map((i) => {
const ch = CX.chip(CX.status(i));
const split = stores.filter((x) => (i.q[x.id] || 0) > 0).map((x) => x.short + ' ' + i.q[x.id]).join(' · ');
return { name: CX.label(i), href: mode ? 'Movimentar.dc.html#' + mode + '-' + i.id : 'Item.dc.html#' + i.id, meta: i.cat + ' · ' + i.cod + (split ? ' · ' + split : ''), qty: String(CX.total(i)), unid: i.unid === 'par' ? 'pares' : 'un.', chip: ch.t, chipBg: ch.bg, chipFg: ch.fg };
});
const sug = (hasQuery && !vmode && items.length === 0) ? CX.suggest(query) : null;
const recents = ['Camiseta básica', 'Tênis casual', 'Jaqueta'].map((t) => ({
text: t,
pick: () => this.setState({ query: t, voice: '', listening: false })
}));
const showList = !listening && (!!vmode || hasQuery);
return {
accent: accent,
query: query,
listening: listening,
voice: !!vmode, voiceText: vtext[vmode] || '',
hasPick: !!mode, pickText: mode === 'entrada' ? 'Escolha o item que recebeu para registrar a entrada.' : 'Escolha o item que saiu para registrar a saída.',
hasSuggestion: !!sug, suggestion: sug ? sug.name : '', useSuggestion: () => this.setState({ query: sug ? sug.name : '' }),
try1: () => this.setState({ voice: 'baixo', query: '', listening: false }),
try2: () => this.setState({ voice: 'zero', query: '', listening: false }),
try3: () => this.setState({ voice: 'tenis', query: '', listening: false }),
scan: () => this.setState({ query: 'CAM-0042', voice: false, listening: false }),
idle: !listening && !vmode && !hasQuery,
showList: showList,
items: items,
isEmpty: showList && items.length === 0,
countLabel: items.length + (items.length === 1 ? ' item' : ' itens'),
recents: recents,
micBg: listening ? accent : 'transparent',
micStroke: listening ? '#FFFFFF' : accent,
onSearch: (e) => this.setState({ query: e.target.value, voice: '' }),
toggleMic: () => this.setState({ listening: !listening, voice: '', query: '' }),
stopMic: () => this.setState({ listening: false, voice: 'baixo', query: '' }),
reset: () => this.setState({ query: '', listening: false, voice: '' })
};
}
}
</script>
</body>
</html>
