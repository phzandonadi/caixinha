<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Conectar sistema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* listas roláveis: nada encolhe nem se sobrepõe */
[style*="overflow-y: auto"]>*,[style*="overflow: auto"]>*{flex-shrink:0}
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
body{margin:0;background:#FFF6EC}
a{text-decoration:none}
button,input{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="flex: none; background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="PontoDeVenda.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Conectar sistema</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 24px 20px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Tipo de sistema</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{types}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 800; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome da conexão</label>
<input id="nome" type="text" placeholder="Ex.: PDV do balcão" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="url" style="font-size: 14px; font-weight: 700; color: #4A1F05">Endereço do sistema</label>
<input id="url" type="url" placeholder="https://" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="chave" style="font-size: 14px; font-weight: 700; color: #4A1F05">Chave de acesso (API)</label>
<input id="chave" type="password" placeholder="Cole aqui a chave gerada no sistema" autocomplete="off" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
<span style="font-size: 13px; font-weight: 600; line-height: 1.4; color: #5C3A24">Você gera a chave dentro do seu sistema de vendas. O Caixinha só lê vendas e estoque.</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Usar em quais lojas?</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{stores}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 800; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{test}}" style="height: 48px; border: 2px solid {{accent}}; border-radius: 14px; background: transparent; color: {{accent}}; font-size: 16px; font-weight: 800; cursor: pointer">{{testLabel}}</button>
<sc-if value="{{ tested }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #DDEFD8; color: #1F4D1A; font-size: 14px; font-weight: 800">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1F4D1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Conexão funcionando. Encontramos 1.248 produtos.
</div>
</sc-if>
</div>

</div>

<div style="flex: none; padding: 12px 20px 24px 20px; background: #FFF6EC; border-top: 2px solid #F0DCC8; display: flex; gap: 10px">
<a href="PontoDeVenda.dc.html" style="flex: 1; height: 52px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 16px; color: {{accent}}; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">Cancelar</a>
<a href="PontoDeVenda.dc.html" style="flex: 2; height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">Conectar</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const st = this.state || {};
const type = st.type || 'PDV de balcão';
const store = st.store || 'Todas';
const testing = !!st.testing;
const chips = (list, cur, key) => list.map((l) => ({
label: l,
pressed: String(cur === l),
bg: cur === l ? accent : '#F3DFCB',
fg: cur === l ? '#FFFFFF' : '#4A1F05',
pick: () => this.setState({ [key]: l, tested: false })
}));
return {
accent: accent,
types: chips(['PDV de balcão', 'ERP', 'Loja virtual', 'Outro'], type, 'type'),
stores: chips(['Todas', 'Loja Centro', 'Loja Shopping', 'Loja Norte'], store, 'store'),
tested: !!st.tested,
testLabel: testing ? 'Testando…' : 'Testar conexão',
test: () => {
this.setState({ testing: true, tested: false });
setTimeout(() => this.setState({ testing: false, tested: true }), 1200);
}
};
}
}
</script>
</body>
</html>
