<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Perfil</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
body{margin:0;background:#FFF6EC}
a{text-decoration:none}
button,input{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="Mais.dc.html" aria-label="Voltar ao menu" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Perfil</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 24px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="position: relative; width: 104px; height: 104px">
<div style="width: 104px; height: 104px; border-radius: 52px; background: #FFE3C8; border: 3px solid #FA9445; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"></path></svg>
</div>
<button type="button" aria-label="Trocar foto do perfil" style="position: absolute; right: -2px; bottom: 0; width: 40px; height: 40px; border-radius: 20px; border: 3px solid #FFF6EC; background: {{accent}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
</button>
</div>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 16px; background: #FFE0A3; color: #5A3A00; font-size: 14px; font-weight: 800">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5A3A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
Administrador
</span>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome</label>
<input id="nome" type="text" value="{{nome}}" onChange="{{onNome}}" autocomplete="name" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 700; color: #4A1F05">E-mail</label>
<input id="email" type="email" value="{{email}}" onChange="{{onEmail}}" autocomplete="email" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{togglePwBox}}" aria-expanded="{{pwOpen}}" style="height: 48px; border: 2px solid {{accent}}; border-radius: 12px; background: transparent; color: {{accent}}; font-size: 16px; font-weight: 800; cursor: pointer">{{pwBtn}}</button>
<sc-if value="{{ pwOpen }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="atual" style="font-size: 14px; font-weight: 700; color: #4A1F05">Senha atual</label><input id="atual" type="password" value="{{pwOld}}" onChange="{{onOld}}" autocomplete="current-password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nova" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nova senha</label><input id="nova" type="password" value="{{pwNew}}" onChange="{{onNew}}" autocomplete="new-password" placeholder="Pelo menos 8 caracteres" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="conf" style="font-size: 14px; font-weight: 700; color: #4A1F05">Repita a nova senha</label><input id="conf" type="password" value="{{pwConf}}" onChange="{{onConf}}" autocomplete="new-password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203"></div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Cargo</span>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #F0DCC8; border-radius: 12px; background: #F6E9DB">
<span style="flex: 1; font-size: 16px; font-weight: 700; color: #5C3A24">Administrador</span>
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7A5C48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</div>
<span style="font-size: 13px; font-weight: 600; color: #5C3A24">O cargo é definido por um administrador e não pode ser alterado aqui.</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FAD2CB; color: #7A1E10; font-size: 14px; font-weight: 700">{{err}}</p></sc-if>
<sc-if value="{{ hasOk }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #DDEFD8; color: #1F4D1A; font-size: 14px; font-weight: 700">{{ok}}</p></sc-if>
<button type="button" onClick="{{save}}" style="height: 52px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">Salvar alterações</button>
<a href="Main.dc.html" style="height: 52px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 16px; color: {{accent}}; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"></path></svg>
Sair da conta
</a>
</div>

</div>

<nav aria-label="Navegação principal" style="flex: none; position: relative; z-index: 1; height: 80px; box-sizing: border-box; background: #FFFFFF; border-top: 2px solid #F0DCC8; display: flex; align-items: flex-start; padding: 8px 6px 0 6px">
<a href="Home.dc.html" aria-label="Estoque" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none"><span style="width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#6B4A36" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"></path><path d="M4 8l8 4 8-4"></path><path d="M12 12v9"></path></svg></span><span style="font-size: 12px; font-weight: 800; color: #6B4A36">Estoque</span></a>
<a href="Historico.dc.html" aria-label="Histórico" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none"><span style="width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#6B4A36" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v14M3 14l4 4 4-4"></path><path d="M17 20V6M13 10l4-4 4 4"></path></svg></span><span style="font-size: 12px; font-weight: 800; color: #6B4A36">Histórico</span></a>
<a href="Caixinha.dc.html" aria-label="Assistente Caixinha" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -30px; text-decoration: none"><span style="width: 66px; height: 66px; box-sizing: border-box; border-radius: 33px; background: {{accent}}; border: 4px solid #FFF6EC; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(46, 18, 3, 0.35)"><svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><path d="M7 19L2 10l15 3 1 6z" fill="#FFB36B"></path><path d="M41 19l5-9-15 3-1 6z" fill="#FFB36B"></path><rect x="7" y="18" width="34" height="25" rx="5" fill="#FA9445"></rect><rect x="7" y="18" width="34" height="6" rx="3" fill="#D9701F"></rect><circle cx="17" cy="31" r="2.3" fill="#2E1203"></circle><path d="M27 31q3-3.2 6 0" fill="none" stroke="#2E1203" stroke-width="2.2" stroke-linecap="round"></path><path d="M18 37q6 4.5 12 0" fill="none" stroke="#2E1203" stroke-width="2.2" stroke-linecap="round"></path></svg></span><span style="font-size: 12px; font-weight: 800; color: {{accent}}">Assistente</span></a>
<a href="Estatisticas.dc.html" aria-label="Relatórios" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none"><span style="width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#6B4A36" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg></span><span style="font-size: 12px; font-weight: 800; color: #6B4A36">Relatórios</span></a>
<a href="Mais.dc.html" aria-label="Mais" aria-current="page" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none"><span style="width: 56px; height: 32px; border-radius: 16px; background: #FFE9D2; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="{{accent}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></span><span style="font-size: 12px; font-weight: 800; color: {{accent}}">Mais</span></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const u = CX.get().users[0];
const nome = st.nome !== undefined ? st.nome : u.nome;
const email = st.email !== undefined ? st.email : u.email;
const set = (o) => this.setState(Object.assign({ err: '', ok: '' }, o));
return {
accent: this.props.accent ?? '#9C430C',
nome: nome, email: email, pwOpen: !!st.pwOpen, pwBtn: st.pwOpen ? 'Cancelar troca de senha' : 'Alterar senha',
pwOld: st.old || '', pwNew: st.nw || '', pwConf: st.conf || '',
onNome: (e) => set({ nome: e.target.value }), onEmail: (e) => set({ email: e.target.value }),
onOld: (e) => set({ old: e.target.value }), onNew: (e) => set({ nw: e.target.value }), onConf: (e) => set({ conf: e.target.value }),
togglePwBox: () => set({ pwOpen: !st.pwOpen, old: '', nw: '', conf: '' }),
hasErr: !!st.err, err: st.err || '', hasOk: !!st.ok, ok: st.ok || '',
save: () => {
if (!nome.trim()) { this.setState({ err: 'Digite o seu nome.', ok: '' }); return; }
if (email.indexOf('@') < 1 || email.indexOf('.', email.indexOf('@')) < 0) { this.setState({ err: 'Digite um e-mail válido, como maria@sualoja.com.', ok: '' }); return; }
if (st.pwOpen) {
if (!st.old) { this.setState({ err: 'Digite a senha atual para trocar a senha.', ok: '' }); return; }
if ((st.nw || '').length < 8) { this.setState({ err: 'A nova senha precisa ter pelo menos 8 caracteres.', ok: '' }); return; }
if (st.nw !== st.conf) { this.setState({ err: 'As duas senhas novas não são iguais.', ok: '' }); return; }
}
const s = CX.get(); u.nome = nome.trim(); u.email = email.trim(); s.userName = u.nome.split(' ')[0]; CX.save();
this.setState({ err: '', ok: st.pwOpen ? 'Dados e senha salvos.' : 'Alterações salvas.', pwOpen: false, old: '', nw: '', conf: '' });
}
};
}
}
</script>
</body>
</html>
