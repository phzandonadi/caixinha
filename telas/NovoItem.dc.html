<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Novo item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
button{font-family:'Nunito',system-ui,sans-serif}
input{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="Adicionar.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; text-decoration: none; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Novo item</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 24px 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" aria-label="Adicionar imagem do item" style="position: relative; width: 132px; height: 132px; border: 2px dashed #C98A5B; border-radius: 28px; background: #FFE9D2; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
<span style="font-size: 14px; font-weight: 800; color: {{accent}}">Adicionar foto</span>
</button>

</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome do item</label>
<input id="nome" type="text" placeholder="Ex.: Camiseta básica branca M" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="codigo" style="font-size: 14px; font-weight: 700; color: #4A1F05">ID do item</label>
<div style="display: flex; gap: 8px">
<input id="codigo" type="text" placeholder="Ex.: CAM-0042" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
<button type="button" aria-label="Ler código de barras" style="width: 48px; height: 48px; flex: none; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>
</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Preço</span>
<div style="display: flex; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="preco" style="font-size: 14px; font-weight: 700; color: #4A1F05">Preço de venda</label>
<div style="display: flex; align-items: center; height: 48px; box-sizing: border-box; padding-left: 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF">
<span style="font-size: 16px; font-weight: 800; color: #5C3A24; margin-right: 6px">R$</span>
<input id="preco" type="text" inputmode="decimal" value="{{price}}" onChange="{{onPrice}}" placeholder="0,00" style="flex: 1; min-width: 0; width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 0; border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: #2E1203">
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="custo" style="font-size: 14px; font-weight: 700; color: #4A1F05">Custo</label>
<div style="display: flex; align-items: center; height: 48px; box-sizing: border-box; padding-left: 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF">
<span style="font-size: 16px; font-weight: 800; color: #5C3A24; margin-right: 6px">R$</span>
<input id="custo" type="text" inputmode="decimal" value="{{cost}}" onChange="{{onCost}}" placeholder="0,00" style="flex: 1; min-width: 0; width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 0; border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: #2E1203">
</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: {{profitBg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{profitFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>
<span style="flex: 1; font-size: 14px; font-weight: 800; line-height: 1.35; color: {{profitFg}}">{{profitLabel}}</span>
</div>
<span style="font-size: 13px; font-weight: 600; line-height: 1.4; color: #5C3A24">O preço e o custo alimentam o faturamento e o lucro nas Estatísticas.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Categoria</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">{{c.label}}</button>
</sc-for>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 2px dashed #C98A5B; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Nova
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; font-weight: 700; color: #4A1F05">Estoque por loja</span>
<span style="font-size: 14px; font-weight: 800; color: {{accent}}">Total: {{total}} un.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 16px">
<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: #2E1203">{{s.name}}</span>
<button type="button" onClick="{{s.dec}}" aria-label="Diminuir {{s.name}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: #F3DFCB; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#4A1F05" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<span style="width: 40px; text-align: center; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 24px; font-weight: 800; color: #4A1F05">{{s.qty}}</span>
<button type="button" onClick="{{s.inc}}" aria-label="Aumentar {{s.name}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: {{accent}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="termo" style="font-size: 14px; font-weight: 700; color: #4A1F05">Termos de busca</label>
<p style="margin: 0; font-size: 13px; font-weight: 600; line-height: 1.4; color: #5C3A24">Palavras parecidas ajudam a achar o item mais rápido, na busca por texto ou por voz.</p>
<div style="display: flex; gap: 8px">
<input id="termo" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="Ex.: blusa, camisa, t-shirt" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
<button type="button" onClick="{{addTerm}}" style="height: 48px; flex: none; padding: 0 16px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer">Adicionar</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{terms}}" as="t" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 4px 0 14px; border-radius: 20px; background: #FFE3C8; color: #4A1F05; font-size: 15px; font-weight: 700">
{{t.text}}
<button type="button" onClick="{{t.remove}}" aria-label="Remover {{t.text}}" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4A1F05" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</span>
</sc-for>
</div>
</div>

</div>

<div style="flex: none; padding: 12px 20px 24px 20px; background: #FFF6EC; border-top: 2px solid #F0DCC8; display: flex; gap: 10px">
<a href="Home.dc.html" style="flex: none; height: 52px; box-sizing: border-box; padding: 0 20px; border: 2px solid {{accent}}; border-radius: 16px; color: {{accent}}; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Cancelar</a>
<a href="Home.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Salvar item
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const st = this.state || {};
const num = (s) => { const n = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const priceStr = st.price !== undefined ? st.price : '';
const costStr = st.cost !== undefined ? st.cost : '';
const pr = num(priceStr), co = num(costStr);
const brl = (n) => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let profitLabel = 'Informe o preço de venda e o custo para ver o lucro.', profitBg = '#F6E9DB', profitFg = '#5C3A24';
if (pr > 0 && co > 0) {
const lucro = pr - co;
profitLabel = 'Lucro de ' + brl(lucro) + ' por unidade · margem de ' + Math.round(lucro / pr * 100) + '%';
if (lucro >= 0) { profitBg = '#DDEFD8'; profitFg = '#1F4D1A'; } else { profitBg = '#FAD2CB'; profitFg = '#7A1E10'; profitLabel = 'Atenção: o custo é maior que o preço (' + brl(lucro) + ' por unidade)'; }
}
const cat = st.cat || 'Roupas';
const qty = st.qty || { centro: 24, shopping: 12, norte: 0 };
const terms = st.terms || ['blusa', 'camisa', 't-shirt'];
const draft = st.draft || '';
const storeList = [
{ id: 'centro', name: 'Loja Centro' },
{ id: 'shopping', name: 'Loja Shopping' },
{ id: 'norte', name: 'Loja Norte' }
];
const setQty = (id, delta) => {
const cur = this.state && this.state.qty ? this.state.qty : { centro: 24, shopping: 12, norte: 0 };
const next = Object.assign({}, cur);
next[id] = Math.max(0, (next[id] || 0) + delta);
this.setState({ qty: next });
};
const cats = ['Roupas', 'Calçados', 'Acessórios'].map((c) => {
const on = c === cat;
return {
label: c, on: on,
bg: on ? accent : '#FFFFFF',
fg: on ? '#FFFFFF' : '#2E1203',
border: on ? accent : '#D9BFA6',
pick: () => this.setState({ cat: c })
};
});
const stores = storeList.map((s) => ({
name: s.name,
qty: String(qty[s.id] || 0),
dec: () => setQty(s.id, -1),
inc: () => setQty(s.id, 1)
}));
return {
accent: accent,
price: priceStr,
cost: costStr,
profitLabel: profitLabel,
profitBg: profitBg,
profitFg: profitFg,
onPrice: (e) => this.setState({ price: e.target.value }),
onCost: (e) => this.setState({ cost: e.target.value }),
cats: cats,
stores: stores,
total: String(storeList.reduce((a, s) => a + (qty[s.id] || 0), 0)),
draft: draft,
terms: terms.map((t) => ({
text: t,
remove: () => {
const cur = this.state && this.state.terms ? this.state.terms : ['blusa', 'camisa', 't-shirt'];
this.setState({ terms: cur.filter((x) => x !== t) });
}
})),
onDraft: (e) => this.setState({ draft: e.target.value }),
addTerm: () => {
const cur = this.state && this.state.terms ? this.state.terms : ['blusa', 'camisa', 't-shirt'];
const d = ((this.state && this.state.draft) || '').trim();
if (!d || cur.includes(d)) return;
this.setState({ terms: cur.concat(d), draft: '' });
}
};
}
}
</script>
</body>
</html>
