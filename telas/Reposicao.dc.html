<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixinha - Lista de compra</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
/* listas roláveis: nada encolhe nem se sobrepõe */
[style*="overflow-y: auto"]>*,[style*="overflow: auto"]>*{flex-shrink:0}
/* toque: alvo mínimo de 52px (~0,8 cm) em todo controle */
button,a[href],[role=switch],[role=button],select{min-height:52px!important;min-width:52px!important;box-sizing:border-box}
input:not([type=checkbox]):not([type=radio]){min-height:52px!important;box-sizing:border-box}
button:not([style*="width"]),a[href]:not([style*="width"]){touch-action:manipulation}
html,body{margin:0;height:100%}
x-dc{display:block;height:100%}
a{text-decoration:none}
button,input,select{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">
<div style="flex: none; position: relative; z-index: 3; background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px"><a href="Mais.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #FFD9B0; line-height: 1.1">O que repor</span><h1 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Lista de compra</h1></div></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 20px 16px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5C3A24">Itens zerados ou com estoque baixo, agrupados por fornecedor. A quantidade sugerida leva o item ao dobro do estoque mínimo.</p>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 800; color: #5C3A24; text-transform: uppercase; letter-spacing: 0.04em">{{g.name}}</span>
<div style="flex: none; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px; display: flex; flex-direction: column">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F3E4D4; color: inherit">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: #2E1203">{{r.name}}</span><span style="font-size: 13px; font-weight: 600; color: #5C3A24">Tem {{r.have}} · mínimo {{r.min}}</span></span>
<span style="font-size: 16px; font-weight: 800; color: {{accent}}">Comprar {{r.buy}}</span>
</a>
</sc-for></div></div>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 24px 0; text-align: center; font-size: 15px; font-weight: 600; color: #5C3A24">Nada para repor agora. Todos os itens estão acima do mínimo.</p></sc-if>
</div>
<sc-if value="{{ hasList }}" hint-placeholder-val="{{ true }}">
<div style="flex: none; padding: 12px 16px 24px 16px; background: #FFF6EC; border-top: 2px solid #F0DCC8">
<button type="button" onClick="{{copy}}" style="height: 56px; width: 100%; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">{{copyLabel}}</button>
</div></sc-if>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';

const s = CX.get();
const need = s.items.filter((i) => CX.status(i) !== 'ok');
const map = {};
need.forEach((i) => { const f = (s.fornecedores && s.fornecedores[i.cat]) || 'Outros'; (map[f] = map[f] || []).push(i); });
const groups = Object.keys(map).sort().map((f) => ({ name: f, rows: map[f].map((i) => { const have = CX.total(i); return { name: CX.label(i), have: have + ' ' + i.unid, min: i.min, buy: Math.max(i.min * 2 - have, 1) + ' ' + i.unid, href: 'Item.dc.html#' + i.id }; }) }));
const text = groups.map((g) => g.name + '\n' + g.rows.map((r) => '- ' + r.name + ': ' + r.buy).join('\n')).join('\n\n');
return {
accent: accent, groups: groups, empty: need.length === 0, hasList: need.length > 0,
copyLabel: (this.state && this.state.copied) ? 'Lista copiada' : 'Copiar lista',
copy: () => {
try { navigator.clipboard.writeText(text).then(() => this.setState({ copied: true }), () => this.setState({ copied: true })); } catch (e) { this.setState({ copied: true }); }
}
};

}
}
</script>
</body>
</html>
