<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixinha - Contagem</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
html,body{margin:0;height:100%}
x-dc{display:block;height:100%}
a{text-decoration:none}
button,input,select{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">
<div style="flex: none; position: relative; z-index: 3; background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px"><a href="Mais.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #FFD9B0; line-height: 1.1">Conferir a prateleira</span><h1 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Contar o estoque</h1></div></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 800; color: #5C3A24; text-transform: uppercase; letter-spacing: 0.04em">Qual loja você está contando?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{lojas}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">{{c.label}}</button></sc-for></div>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5C3A24">Digite o que você contou em cada item. Deixe em branco o que não contou.</p>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="flex: none; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: #2E1203">{{r.name}}</span><span style="font-size: 13px; font-weight: 600; color: #5C3A24">No app: {{r.sys}} · <b style="color: {{r.fg}}">{{r.diff}}</b></span></span>
<label for="c{{r.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Contagem de {{r.name}}</label>
<input id="c{{r.id}}" type="text" inputmode="numeric" autocomplete="off" value="{{r.val}}" onChange="{{r.onCount}}" placeholder="—" style="width: 72px; height: 48px; flex: none; box-sizing: border-box; padding: 0 8px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; text-align: center; font-size: 20px; font-weight: 800; color: #2E1203">
</div>
</sc-for>
<span style="font-size: 13px; font-weight: 800; color: #5C3A24; text-transform: uppercase; letter-spacing: 0.04em">Motivo da diferença</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{motivos}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">{{c.label}}</button></sc-for></div><sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FAD2CB; color: #7A1E10; font-size: 14px; font-weight: 700">{{err}}</p></sc-if>
</div>
<div style="flex: none; padding: 12px 16px 24px 16px; background: #FFF6EC; border-top: 2px solid #F0DCC8">
<button type="button" onClick="{{apply}}" style="height: 56px; width: 100%; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">{{applyLabel}}</button>
</div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';

const st = this.state || {};
const stores = CX.stores();
const loja = st.loja || 'centro';
const counts = st.counts || {};
const motivos = ['Contagem de inventário', 'Erro de lançamento', 'Perda ou furto'];
const motivo = st.motivo || motivos[0];
const pill = (on) => ({ bg: on ? accent : '#FFFFFF', fg: on ? '#FFFFFF' : '#4A1F05', bd: on ? accent : '#E2C9B2' });
const items = CX.get().items.filter((i) => (i.q[loja] || 0) > 0 || counts[i.id] !== undefined);
let n = 0;
const rows = items.map((i) => {
const sys = i.q[loja] || 0, raw = counts[i.id];
const has = raw !== undefined && String(raw) !== '';
const dif = has ? Number(raw) - sys : 0;
if (has && dif !== 0) n++;
return { id: i.id, name: CX.label(i), sys: String(sys), val: raw === undefined ? '' : String(raw),
diff: !has ? 'não contado' : (dif === 0 ? 'confere' : (dif > 0 ? 'sobram ' + dif : 'faltam ' + Math.abs(dif))),
fg: !has ? '#5C3A24' : (dif === 0 ? '#1F4D1A' : '#7A1E10'),
onCount: (e) => { const c = Object.assign({}, this.state && this.state.counts); c[i.id] = String(e.target.value).replace(/\D/g, '').slice(0, 5); this.setState({ counts: c, err: '' }); } };
});
return {
accent: accent, rows: rows,
lojas: stores.map((s) => Object.assign({ label: s.short, on: s.id === loja, pick: () => this.setState({ loja: s.id, counts: {}, err: '' }) }, pill(s.id === loja))),
motivos: motivos.map((m) => Object.assign({ label: m, on: m === motivo, pick: () => this.setState({ motivo: m }) }, pill(m === motivo))),
hasErr: !!st.err, err: st.err || '',
applyLabel: n === 0 ? 'Ajustar diferenças' : 'Ajustar ' + n + (n === 1 ? ' diferença' : ' diferenças'),
apply: () => {
let c = 0;
items.forEach((i) => { const raw = counts[i.id]; if (raw !== undefined && String(raw) !== '' && Number(raw) !== (i.q[loja] || 0)) { CX.ajuste(i.id, loja, Number(raw), motivo); c++; } });
if (!c) { this.setState({ err: 'Nenhuma diferença para ajustar. Digite uma contagem diferente do que está no app.' }); return; }
CX.setToast(c + (c === 1 ? ' item ajustado' : ' itens ajustados') + ' na ' + CX.storeName(loja) + '. Veja no histórico.', true);
CX.go('Historico.dc.html');
}
};

}
}
</script>
</body>
</html>
