<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Escolher lojas</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF6EC}
button{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="position: relative; z-index: 3; background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Perfil do usuário" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 2px solid #FA9445; background: #FFF1E2; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9C430C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"></path></svg>
</button>
<button type="button" onClick="{{toggleOpen}}" aria-expanded="{{open}}" aria-label="Escolher loja" style="flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 16px; background: #7E3409; cursor: pointer; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; text-align: left">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 700; color: #FFD9B0; line-height: 1.1">Estoque</span>
<span style="font-size: 16px; font-weight: 800; color: #FFF1E2; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{storeLabel}}</span>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<button type="button" aria-label="Filtrar por categoria ou loja" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: #7E3409; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>
</button>
<button type="button" onClick="{{toggleSearch}}" aria-label="Buscar item" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: {{searchBg}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{searchStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
</button>
</div>
<sc-if value="{{ searching }}" hint-placeholder-val="{{ false }}">
<div>
<label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar item pelo nome</label>
<input id="busca" type="text" value="{{query}}" onChange="{{onSearch}}" placeholder="Buscar item pelo nome" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #FFF6EC; font-family: 'Nunito', sans-serif; font-size: 16px; color: #2E1203">
</div>
</sc-if>
</div>

<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 8px 20px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; color: #4A1F05">Itens do estoque</h2>
<span style="font-size: 14px; font-weight: 700; color: #5C3A24">{{countLabel}}</span>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 110px 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px">
<div style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #FFE3C8; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#9C430C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"></path><path d="M4 8l8 4 8-4"></path><path d="M12 12v9"></path></svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; line-height: 1.25; color: #2E1203">{{item.name}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5C3A24">{{item.meta}}</span>
<span style="align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; background: {{item.chipBg}}; color: {{item.chipFg}}">{{item.chip}}</span>
</div>
<div style="flex: none; display: flex; flex-direction: column; align-items: center; min-width: 44px">
<span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.1; color: #4A1F05">{{item.qty}}</span>
<span style="font-size: 12px; font-weight: 700; color: #5C3A24">un.</span>
</div>
</div>
</sc-for>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 0; text-align: center; font-size: 15px; font-weight: 600; color: #5C3A24">Nenhum item encontrado nas lojas selecionadas.</p>
</sc-if>
</div>

<button type="button" aria-label="Adicionar item ao inventário" style="position: absolute; z-index: 1; right: 20px; bottom: 24px; width: 62px; height: 62px; border-radius: 31px; border: 0; background: #FA9445; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(46, 18, 3, 0.35)">
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#2E1203" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{closeSheet}}" aria-label="Fechar seleção de lojas" style="position: absolute; z-index: 2; left: 0; top: 0; right: 0; bottom: 0; width: 100%; height: 100%; border: 0; padding: 0; background: rgba(46, 18, 3, 0.5); cursor: default"></button>
<div style="position: absolute; z-index: 4; left: 16px; right: 16px; top: {{panelTop}}px; background: #FFF6EC; border-radius: 22px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 12px 32px rgba(46, 18, 3, 0.35)">
<p style="margin: 6px 12px 4px 12px; font-size: 13px; font-weight: 700; color: #5C3A24">Qual estoque você quer ver?</p>
<sc-for list="{{storeRows}}" as="row" hint-placeholder-count="3">
<button type="button" onClick="{{row.toggle}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 54px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 14px; background: transparent; cursor: pointer; text-align: left">
<span style="width: 24px; height: 24px; flex: none; box-sizing: border-box; border-radius: 8px; border: 2px solid {{row.border}}; background: {{row.bg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="{{row.check}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</span>
<span style="flex: 1; font-size: 16px; font-weight: 700; color: #2E1203">{{row.name}}</span>
<span style="font-size: 13px; font-weight: 700; color: #5C3A24">{{row.count}}</span>
</button>
</sc-for>
<div style="height: 2px; margin: 2px 12px; background: #F0DCC8"></div>
<button type="button" onClick="{{selectAll}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 54px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 14px; background: transparent; cursor: pointer; text-align: left">
<span style="width: 24px; height: 24px; flex: none; box-sizing: border-box; border-radius: 8px; border: 2px solid {{allBorder}}; background: {{allBg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="{{allCheck}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</span>
<span style="flex: 1; font-size: 16px; font-weight: 800; color: #2E1203">Todas as lojas</span>
<span style="font-size: 13px; font-weight: 700; color: #5C3A24">{{totalLabel}}</span>
</button>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 0 2px 0 12px">
<span style="font-size: 14px; font-weight: 700; color: #5C3A24">{{selectedLabel}}</span>
<a href="Home.dc.html" style="height: 48px; box-sizing: border-box; padding: 0 28px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Confirmar</a>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const st = this.state || {};
const allIds = ['centro', 'shopping', 'norte'];
const defaultSel = CX.sel();
const sel = st.sel || defaultSel;
const open = st.open === undefined ? true : !!st.open;
const searching = !!st.search;
const query = st.query || '';
const stores = [
{ id: 'centro', name: 'Loja Centro' },
{ id: 'shopping', name: 'Loja Shopping' },
{ id: 'norte', name: 'Loja Norte' }
];
const all = [];
CX.get().items.forEach((it) => { stores.forEach((s) => { if ((it.q[s.id] || 0) > 0) all.push({ name: it.name, cat: it.cat, store: s.id, qty: it.q[s.id] }); }); });
const nameOf = (id) => stores.find((s) => s.id === id).name;
const q = query.trim().toLowerCase();
const visible = all.filter((i) => sel.includes(i.store) && i.name.toLowerCase().includes(q));
const items = visible.map((i) => {
let chip = 'Em estoque', chipBg = '#DDEFD8', chipFg = '#1F4D1A';
if (i.qty === 0) { chip = 'Sem estoque'; chipBg = '#FAD2CB'; chipFg = '#7A1E10'; }
else if (i.qty <= 10) { chip = 'Estoque baixo'; chipBg = '#FFE0A3'; chipFg = '#5A3A00'; }
return { name: i.name, meta: i.cat + ' · ' + nameOf(i.store), qty: String(i.qty), chip: chip, chipBg: chipBg, chipFg: chipFg };
});
const allSelected = sel.length === allIds.length;
let storeLabel = 'Todas as lojas';
if (!allSelected) storeLabel = sel.length === 1 ? nameOf(sel[0]) : sel.length + ' lojas';
const plural = (n) => n + (n === 1 ? ' item' : ' itens');
const storeRows = stores.map((s) => {
const on = sel.includes(s.id);
return {
name: s.name,
count: plural(all.filter((i) => i.store === s.id).length),
bg: on ? accent : '#FFFFFF',
border: on ? accent : '#C9A98F',
check: on ? '#FFFFFF' : 'transparent',
toggle: () => {
const cur = this.state && this.state.sel ? this.state.sel : defaultSel;
if (cur.includes(s.id)) {
if (cur.length === 1) { this.setState({ hint: true }); return; }
const nx = cur.filter((x) => x !== s.id); CX.setSel(nx);
this.setState({ sel: nx, hint: false });
} else {
const nx = cur.concat(s.id); CX.setSel(nx);
this.setState({ sel: nx, hint: false });
}
}
};
});
return {
accent: accent,
open: open,
searching: searching,
query: query,
panelTop: searching ? 140 : 84,
storeLabel: storeLabel,
searchBg: searching ? '#FFF1E2' : '#7E3409',
searchStroke: searching ? accent : '#FFF1E2',
items: items,
isEmpty: items.length === 0,
countLabel: plural(items.length),
totalLabel: plural(all.length),
selectedLabel: st.hint ? 'Escolha pelo menos uma loja' : allSelected ? 'Todas as lojas' : (sel.length === 1 ? '1 loja selecionada' : sel.length + ' lojas selecionadas'),
storeRows: storeRows,
allBg: allSelected ? accent : '#FFFFFF',
allBorder: allSelected ? accent : '#C9A98F',
allCheck: allSelected ? '#FFFFFF' : 'transparent',
toggleOpen: () => this.setState({ open: !open }),
closeSheet: () => this.setState({ open: false }),
selectAll: () => { CX.setSel(allIds.slice()); this.setState({ sel: allIds.slice(), hint: false }); },
toggleSearch: () => this.setState({ search: !searching, query: searching ? '' : query }),
onSearch: (e) => this.setState({ query: e.target.value })
};
}
}
</script>
</body>
</html>
