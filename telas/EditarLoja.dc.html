<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixinha - Editar unidade</title>
<script src="./support.js"></script>
<script src="./cx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF6EC}
a{text-decoration:none}
button,input{font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="position: relative; width: 100%; max-width: 390px; height: 100vh; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF6EC; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

<div style="background: {{accent}}; border-radius: 0 0 24px 24px; padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 12px">
<a href="Loja.dc.html" aria-label="Voltar ao perfil da loja" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #7E3409; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF1E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; color: #FFF1E2">Editar unidade</h1>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 24px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button type="button" aria-label="Trocar imagem da unidade" style="width: 112px; height: 112px; border: 2px dashed #C98A5B; border-radius: 30px; background: #FFE9D2; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
<span style="font-size: 13px; font-weight: 800; color: {{accent}}">Trocar foto</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 700; color: #4A1F05">Nome da unidade</label>
<input id="nome" type="text" value="Loja Centro" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="endereco" style="font-size: 14px; font-weight: 700; color: #4A1F05">Endereço</label>
<input id="endereco" type="text" value="Rua das Flores, 123 – Centro" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="display: flex; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="cidade" style="font-size: 14px; font-weight: 700; color: #4A1F05">Cidade</label>
<input id="cidade" type="text" value="São Paulo" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
<div style="width: 92px; flex: none; display: flex; flex-direction: column; gap: 6px">
<label for="uf" style="font-size: 14px; font-weight: 700; color: #4A1F05">UF</label>
<input id="uf" type="text" value="SP" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2E1203">
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #FFFFFF; border: 2px solid #F0DCC8; border-radius: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800; color: #2E1203">Usar o CNPJ da loja</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.35; color: #5C3A24">Desative se esta unidade tiver CNPJ próprio.</span>
</span>
<button type="button" role="switch" aria-checked="{{sameCnpj}}" aria-label="Usar o CNPJ da loja" onClick="{{flip}}" style="position: relative; width: 56px; height: 44px; flex: none; border: 0; background: transparent; cursor: pointer; padding: 0">
<span style="position: absolute; left: 0; top: 8px; width: 56px; height: 28px; border-radius: 14px; background: {{track}}"></span>
<span style="position: absolute; left: {{knob}}px; top: 11px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(46, 18, 3, 0.35)"></span>
</button>
</div>
<sc-if value="{{ ownCnpj }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cnpj" style="font-size: 14px; font-weight: 700; color: #4A1F05">CNPJ da unidade</label>
<input id="cnpj" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #E2C9B2; border-radius: 12px; background: #FFF6EC; font-size: 16px; color: #2E1203">
</div>
</sc-if>
</div>

<button type="button" onClick="{{askRemove}}" style="height: 52px; border: 2px solid #B3261E; border-radius: 16px; background: transparent; color: #B3261E; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
Remover unidade
</button>
<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FAD2CB; color: #7A1E10; font-size: 14px; font-weight: 700">{{err}}</p></sc-if>
</div>

<div style="flex: none; padding: 12px 20px 24px 20px; background: #FFF6EC; border-top: 2px solid #F0DCC8; display: flex; gap: 10px">
<a href="Loja.dc.html" style="flex: none; height: 52px; box-sizing: border-box; padding: 0 20px; border: 2px solid {{accent}}; border-radius: 16px; color: {{accent}}; font-size: 16px; font-weight: 800; display: flex; align-items: center">Cancelar</a>
<a href="Loja.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Salvar alterações
</a>
</div>

<sc-if value="{{ confirm }}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-modal="true" aria-label="Remover unidade" style="position: absolute; z-index: 9; left: 0; top: 0; right: 0; bottom: 0; background: rgba(46, 18, 3, 0.6); display: flex; align-items: center; justify-content: center; padding: 24px">
<div style="width: 100%; background: #FFF6EC; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.25; color: #2E1203">Remover {{storeName}}?</h2>
<p style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; color: #5C3A24">{{confirmText}}</p>
<sc-if value="{{ hasStock }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{dests}}" as="d" hint-placeholder-count="2"><button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{d.bd}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 15px; font-weight: 800; cursor: pointer">{{d.label}}</button></sc-for></div></sc-if>
<div style="display: flex; gap: 10px"><button type="button" onClick="{{keep}}" style="flex: 1; height: 52px; border: 2px solid {{accent}}; border-radius: 16px; background: transparent; color: {{accent}}; font-size: 16px; font-weight: 800; cursor: pointer">Cancelar</button><button type="button" onClick="{{doRemove}}" style="flex: 1; height: 52px; border: 0; border-radius: 16px; background: #B3261E; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Remover</button></div></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9C430C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#9C430C';
const same = !(this.state && this.state.same === false);
const st = this.state || {};
const sid = (CX.hash() || 'centro').replace(/[^a-z]/g, '') || 'centro';
const others = CX.stores().filter((x) => x.id !== sid);
const stock = CX.get().items.reduce((a, it) => a + (it.q[sid] || 0), 0);
const dest = st.dest || (others[0] && others[0].id);
return {
accent: accent,
sameCnpj: same,
ownCnpj: !same,
track: same ? accent : '#D9BFA6',
knob: same ? 30 : 4,
flip: () => this.setState({ same: !same }),
storeName: CX.storeName(sid), confirm: !!st.confirm, hasStock: stock > 0,
confirmText: stock > 0 ? 'Esta unidade tem ' + stock + ' unidades em estoque. Escolha para qual unidade levar tudo. A transferência fica no histórico.' : 'Esta unidade não tem estoque. Ela some da lista de lojas.',
dests: others.map((o) => ({ label: o.name, on: dest === o.id, bg: dest === o.id ? accent : '#FFFFFF', fg: dest === o.id ? '#FFFFFF' : '#2E1203', bd: dest === o.id ? accent : '#E2C9B2', pick: () => this.setState({ dest: o.id }) })),
hasErr: !!st.err, err: st.err || '',
askRemove: () => { if (others.length === 0) { this.setState({ err: 'Você precisa manter pelo menos uma unidade.' }); return; } this.setState({ confirm: true, err: '' }); },
keep: () => this.setState({ confirm: false }),
doRemove: () => { const r = CX.removeStore(sid, dest); if (!r.ok) { this.setState({ confirm: false, err: r.erro }); return; } CX.go('Loja.dc.html'); }
};
}
}
</script>
</body>
</html>
